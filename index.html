<script>
const TC={run:'var(--run)',ride:'var(--ride)',gym:'var(--gym)',meal:'var(--meal)'},TABS=[['today','Today'],['log','Log'],['meals','Meals'],['prog','Progress'],['set','Settings']];
const iso=d=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10),today=()=>iso(new Date()),add=(s,n)=>{const d=new Date(s+'T00:00');d.setDate(d.getDate()+n);return iso(d)};
const wk=s=>{const d=new Date(s+'T00:00');d.setDate(d.getDate()-(d.getDay()+6)%7);return iso(d)};
const lbl=s=>new Date(s+'T00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const n1=n=>(Math.round(n*10)/10).toString().replace('.',','),sum=(a,f)=>a.reduce((s,x)=>s+(f(x)||0),0);
const S0=()=>({act:[],meals:[],chk:{},g:{kcal:2400,p:150,c:260,f:70,wk:30},d:today()});
let S,tab='today',F='all',D={};try{S=JSON.parse(localStorage.getItem('stride1'))}catch(e){}S=S||S0();
const save=()=>{try{localStorage.setItem('stride1',JSON.stringify(S))}catch(e){}try{pdb('put','state',JSON.stringify(S))}catch(e){}try{flashSaved()}catch(e){}};
const pace=a=>{const p=a.min/a.dist,m=Math.floor(p),s=Math.round((p-m)*60);return m+':'+String(s==60?0:s).padStart(2,'0')+' /km'};
const vol=a=>sum(a.ex||[],e=>e.sets?sum(e.sets,x=>x.r*x.w):e.s*e.r*e.w);
const exTxt=ex=>(ex||[]).map(e=>`${e.n} ${e.s}x${e.r}${e.w?' @ '+e.w:''}`).join('\n');
const pxSplit=t=>{const ok=[],rest=[];t.split('\n').map(l=>l.trim()).filter(Boolean).forEach(l=>{const c=l.replace(/\b(kgs?|kilos?|kilograms?)\b/gi,'').replace(/(\d+)\s*sets?\s*(?:of|x)?\s*(\d+)(?:\s*reps?)?/i,'$1x$2');let m=c.match(/^(.+?)[\s:,-]+(\d+)\s*[x×*]\s*(\d+)(?:\s*(?:@|at|with|\/)?\s*([\d.,]+))?/i);if(m){ok.push({n:m[1].trim(),s:+m[2],r:+m[3],w:m[4]?+m[4].replace(',','.'):0});return}m=c.match(/^(.+?)[\s:,-]+(\d+)\s*reps?\b(?:\s*(?:@|at|with)?\s*([\d.,]+))?/i);if(m)ok.push({n:m[1].trim(),s:1,r:+m[2],w:m[3]?+m[3].replace(',','.'):0});else rest.push(l)});return{ok,rest}};
const px=t=>pxSplit(t).ok;
const det=a=>a.type=='gym'?`${a.min} min, ${(a.ex||[]).length} exercises, ${Math.round(vol(a))} kg lifted`:`${n1(a.dist)} km in ${a.min} min, ${a.type=='run'?pace(a):n1(a.dist/(a.min/60))+' km/h'}`;
const tot=d=>{const m=S.meals.filter(x=>x.date==d);return{k:sum(m,x=>x.kcal),p:sum(m,x=>x.p),c:sum(m,x=>x.c),f:sum(m,x=>x.f)}};
const ring=(v,t,col,l,u)=>{const p=Math.min(1,t?v/t:0),c=2*Math.PI*34;return`<div class="ring"><svg viewBox="0 0 80 80" width="88" height="88" role="img" aria-label="${l}"><circle cx="40" cy="40" r="34" fill="none" stroke="var(--line)" stroke-width="7"/><circle cx="40" cy="40" r="34" fill="none" stroke="${col}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${p*c} ${c}" transform="rotate(-90 40 40)"/><text x="40" y="45" text-anchor="middle" style="font:800 15px Manrope,sans-serif;fill:var(--ink)">${Math.round(v)}</text></svg>${l}<br>of ${t}${u}</div>`};
const item=a=>`<div class="item" data-del="act:${a.id}"><i class="dot" style="background:${TC[a.type]}"></i><div style="flex:1"><b>${esc(a.name||a.type)}</b> <span class="mut">${lbl(a.date)}</span><div class="mut">${det(a)}${burnTxt(a)}${a.hr?', '+a.hr+' bpm':''}</div>${a.type=='gym'&&(a.ex||[]).length?`<div class="mut" style="font-size:.85rem">${a.ex.map(e=>esc(e.n)+' '+exSum(e)).join('<br>')}</div>`:''}${a.notes?`<div style="white-space:pre-wrap">${esc(a.notes)}</div>`:''}<div class="row" style="margin-top:.3rem"><button class="btn g s" onclick="openAdd('','${a.id}')">Edit</button><button class="btn g s" onclick="rep('${a.id}')">Repeat today</button><button class="btn g s" onclick="del('act','${a.id}')">Delete</button></div></div></div>`;
function streak(){let d=today(),n=0;const has=x=>S.act.some(a=>a.date==x);if(!has(d))d=add(d,-1);while(has(d)){n++;d=add(d,-1)}return n}
function todayv(){const t=today(),T=tot(t),g=S.g,w=wk(t),A=S.act.filter(a=>a.date>=w&&a.type!='gym'),km=sum(A,a=>a.dist),ch=S.chk[t]||{};
const ci=(k,l,u,s)=>`<label class="mut" style="font-size:.8rem">${l}<input type="number" step="${s||1}" value="${ch[k]??''}" style="width:100%" placeholder="${u}" onchange="(S.chk[today()]=S.chk[today()]||{})['${k}']=this.value===''?null:+this.value;save()"></label>`;

function playDraw(){const b=BZ.b,p=b.ph[BP],nx=b.ph.slice(BP+1).find(x=>x.t=='work');tf.innerHTML=`<div style="text-align:center"><div class="mut">${p.t=='work'?'Work':'Rest'}, move ${Math.floor(BP/2)+1} of ${b.ph.length/2}</div><h1>${p.t=='work'?p.n:'Rest'}</h1><div class="big" style="font-size:4.5rem">${BT}</div><div class="bar" style="margin:.5rem 0"><i style="width:${100-BT/p.s*100}%;background:${p.t=='work'?'var(--ride)':'var(--meal)'}"></i></div><p class="mut">${nx?'Next: '+nx.n:'Last one. Finish strong.'}</p><div class="row" style="justify-content:center"><button type="button" class="btn g" onclick="BPA=!BPA;playDraw()">${BPA?'Resume':'Pause'}</button><button type="button" class="btn g" onclick="BT=1">Skip</button><button type="button" class="btn g" onclick="busyDraw()">Stop</button></div></div>`}
function busyDone(){const b=BZ.b;tf.innerHTML=`<div style="text-align:center"><h1>Done. Nice work.</h1><p class="mut">${BZ.m} minutes finished.</p><div class="row" style="justify-content:center"><button type="button" class="btn" onclick="dlg.close();D={id:'',type:'gym',date:today(),name:'Quick ${BZ.m} min',dist:'',min:${BZ.m},hr:0,notes:'Busy-day workout: ${b.mv.map(x=>x[0]).join(', ')}',ex:[]};draw()">Log it</button><button type="button" class="btn g" onclick="dlg.close()">Close</button></div></div>`}
dlg.addEventListener('close',()=>clearInterval(BI));
const WINS=[['water','Drink a glass of water first thing',''],['walk','Walk for 5 minutes after a meal',''],['squat','Do 10 squats while the kettle boils','10 bodyweight squats form'],['protein','Add protein to your breakfast',''],['stretch','Stretch for 2 minutes before bed','2 minute full body stretch'],['breath','Take 5 slow deep breaths','2 minute breathing exercise'],['stairs','Take the stairs once today','']];
function winsCard(){const t=today(),dn=(S.wins||{})[t]||[],d=Math.floor(new Date(t+'T00:00')/864e5),W=[0,1,2].map(k=>WINS[(d+k*2)%7]),sl=(S.chk[t]||{}).sleep;if(sl!=null&&sl<6.5&&!W.some(x=>x[0]=='stretch'))W[2]=WINS[4];const w0=wk(t),days=[...Array(7)].map((_,i)=>((S.wins||{})[add(w0,i)]||[]).length>0),n=days.filter(Boolean).length;
return`<div class="card"><div class="row sp"><h3 style="margin:0">Two-minute wins</h3><span class="mut">${n} of 7 days this week</span></div>${W.map(x=>`<label class="win ${dn.includes(x[0])?'on':''}"><input type="checkbox" ${dn.includes(x[0])?'checked':''} onchange="winTog('${x[0]}')"><span>${x[1]}</span>${x[2]?`<a href="https://www.youtube.com/results?search_query=${encodeURIComponent(x[2])}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Video</a>`:''}</label>`).join('')}<div class="dots">${days.map(y=>`<i class="${y?'on':''}"></i>`).join('')}</div></div>`}
function winTog(id){const t=today();S.wins=S.wins||{};const a=S.wins[t]=S.wins[t]||[],i=a.indexOf(id);i<0?a.push(id):a.splice(i,1);save();R();if(i<0)toast('Nice, that counts')}
const V={today:todayv,log:logv,meals:mealsv,prog:progv,set:setv};
function R(keep){v.innerHTML=V[tab]();if(keep){const e=g$('lq');if(e){e.focus();e.setSelectionRange(e.value.length,e.value.length)}}applyTheme();setTimeout(()=>{hydrate();reveal()},0);nav.innerHTML=TABS.map(([k,l])=>`<button aria-current="${k==tab}" onclick="tab='${k}';R();fade();scrollTo(0,0)">${IC[k]}${l}</button>`).join('')}
R();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
